services:
  portafolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: mi-portafolio:dev
    container_name: mi-portafolio-container
    ports:
      - "8080:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
